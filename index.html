<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM &amp; LA — Gyakorló kvíz</title>
  <script>
    (function () { try { var t = localStorage.getItem('theme'); if (!t) { t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } document.documentElement.setAttribute('data-theme', t); } catch (e) { } })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] }, svg: { fontCache: 'global' }, startup: { typeset: false } };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" id="MathJax-script"></script>
</head>

<body>
  <button id="themebtn" class="theme-toggle" type="button" aria-label="Téma váltása" title="Világos / sötét téma">🌙</button>
  <div class="layout">
    <div class="main-col">
      <header class="masthead">
        <div class="eyebrow">Diszkrét matematika · Lineáris algebra</div>
        <h1>Gyakorló <em>kvíz</em></h1>
        <div class="sub">Online megosztható · véletlen sorsolás · bővíthető kérdésbank</div>
      </header>
      <div id="app">
        <div class="card">
          <div class="lead" style="margin:0">Kérdések betöltése…</div>
        </div>
      </div>
      <footer class="foot" id="foot"></footer>
    </div>

    <div class="sidebar-wrapper">
      <aside class="sidebar" id="sidebar">
        <h3>Kérdések állapota</h3>
        <div class="q-grid" id="q-grid"></div>
        <button class="btn primary" id="sidebar-finishbtn" style="width:100%;">Kvíz befejezése</button>
      </aside>
    </div>
  </div>

  <div id="toast"></div>

  <script src="script.js"></script>
</body>

</html>
